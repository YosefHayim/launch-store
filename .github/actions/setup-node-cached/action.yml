name: Setup Node + cached install
description: >-
  setup-node with the pnpm cache, restore node_modules by an EXACT lockfile hash, and run
  `pnpm install --frozen-lockfile` only on a miss. The single source of the install step every CI leg
  shares, so the cache rule lives in one place instead of being copy-pasted into each reusable workflow.

inputs:
  node-version:
    description: Node major version to set up (e.g. "20" or "22").
    required: true

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v5

    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    # Cache the installed dependency tree so an unchanged lockfile skips `pnpm install` entirely. The key
    # binds OS + Node major + lockfile hash; any dependency change flips the hash and forces a clean
    # reinstall. Deliberately NO restore-keys - a partial node_modules carried over from a different
    # lockfile is a silent correctness hazard, so we reuse an EXACT match or reinstall from scratch.
    # `cache: pnpm` above still warms the pnpm store, so the reinstall on a miss stays fast.
    - name: Cache node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
