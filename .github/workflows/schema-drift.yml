name: ASC schema drift

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup workspace
        uses: $/.github/actions/setup
      - name: Regenerate types from Apple's current spec
        run: pnpm gen:asc
      - name: Fail when the committed types are stale
        run: |
          if ! git diff --quiet -- src/apple-api-types.ts; then
            echo "::error file=src/apple-api-types.ts::Generated App Store Connect types are behind Apple's published OpenAPI spec. Run pnpm gen:asc and commit src/apple-api-types.ts."
            git diff --stat -- src/apple-api-types.ts
            exit 1
          fi
          echo "App Store Connect types match Apple's current spec."
