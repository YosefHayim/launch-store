name: ASC schema drift
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Regenerate types from Apple's current spec
        run: pnpm gen:asc
      - name: Fail if the committed types are stale
        run: |
          if ! git diff --quiet -- src/apple/generated/schema.ts; then
            echo "::error file=src/apple/generated/schema.ts::Generated ASC types are out of date with Apple's published OpenAPI spec. Run 'pnpm gen:asc' and commit the result."
            git diff --stat -- src/apple/generated/schema.ts
            exit 1
          fi
          echo "ASC types are in sync with Apple's current spec."
    timeout-minutes: 15
