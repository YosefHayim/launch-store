name: E2E

# The end-to-end suite drives the emitted CLI as a subprocess. See ADR 0010.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (built CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: 22
      - run: pnpm build
      - name: Run E2E tests
        run: pnpm test:e2e
