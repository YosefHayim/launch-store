name: E2E
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  e2e:
    name: E2E (built CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup workspace
        uses: ./.github/actions/setup
      - run: pnpm build
      - name: Run E2E tests
        run: pnpm test:e2e
    timeout-minutes: 20
