name: Test
'on':
  workflow_call:
    inputs:
      since:
        description: Base commit to test changes against. Empty runs everything with coverage.
        type: string
        default: ''
permissions:
  contents: read
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Test changed files
        if: inputs.since != ''
        env:
          SINCE: ${{ inputs.since }}
        run: pnpm exec vitest run --changed "$SINCE"
      - name: Test (with coverage)
        if: inputs.since == ''
        run: pnpm test:coverage | tee coverage.txt
      - name: Coverage summary
        if: inputs.since == ''
        run: |
          {
            echo '### Coverage (node 24)'
            echo '```'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 20
