name: Test
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Test (with coverage)
        run: pnpm test:coverage | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage (node 24)'
            echo '```'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 20
