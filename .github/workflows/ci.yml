name: CI
'on':
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-slim
    outputs:
      since: ${{ steps.filter.outputs.everything != 'true' && github.event.pull_request.base.sha || '' }}
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      cli: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cli == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          token: ''
          filters: |
            everything: &everything
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - biome.json
              - 'biome-rules/**'
              - 'tsconfig*.json'
              - '*.config.ts'
              - '.github/**'
            code:
              - *everything
              - '**/*.{ts,tsx,css,json,mjs}'
            cli:
              - *everything
              - 'src/**'
              - package.json
    timeout-minutes: 5
  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Test changed files
        if: needs.changes.outputs.since != ''
        env:
          SINCE: ${{ needs.changes.outputs.since }}
        run: pnpm exec vitest run --changed "$SINCE"
      - name: Test (with coverage)
        if: needs.changes.outputs.since == ''
        run: pnpm test:coverage | tee coverage.txt
      - name: Coverage summary
        if: needs.changes.outputs.since == ''
        run: |
          {
            echo '### Coverage (node 24)'
            echo '```'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm build
      - name: Smoke-test the built CLI
        run: |
          node dist/cli/index.js --version
          node dist/cli/index.js --help
          node dist/cli/index.js explain csr
      - name: Run E2E tests
        if: needs.changes.outputs.cli == 'true'
        run: pnpm test:e2e
  gate:
    name: CI Gate
    needs:
      - changes
      - test
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Fail when any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
