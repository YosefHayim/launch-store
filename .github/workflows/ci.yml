name: CI
'on':
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      since: ${{ steps.filter.outputs.everything != 'true' && github.event.pull_request.base.sha || '' }}
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      cli: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cli == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          token: ''
          filters: |
            everything: &everything
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - biome.json
              - 'biome-rules/**'
              - 'tsconfig*.json'
              - '*.config.ts'
              - '.github/**'
            code:
              - *everything
              - '**/*.{ts,tsx,css,json,mjs}'
            docs:
              - *everything
              - 'src/**'
              - 'scripts/**'
              - 'README*.md'
              - 'llms*.txt'
              - 'schema/**'
              - package.json
            cli:
              - *everything
              - 'src/**'
              - package.json
    timeout-minutes: 5
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      since: ${{ needs.changes.outputs.since }}
  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/typecheck.yml
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test.yml
    with:
      since: ${{ needs.changes.outputs.since }}
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build.yml
  e2e:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/e2e.yml
  gate:
    name: CI Gate
    needs:
      - changes
      - lint
      - typecheck
      - docs
      - test
      - build
      - e2e
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Fail when any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
    timeout-minutes: 5
