name: Typecheck
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup workspace
        uses: ./.github/actions/setup
      - run: pnpm typecheck
    timeout-minutes: 15
