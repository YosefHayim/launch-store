name: Lint
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  lint:
    name: Lint & format (biome check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup workspace
        uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm lint:style:self-test
      - run: pnpm lint:style
    timeout-minutes: 15
