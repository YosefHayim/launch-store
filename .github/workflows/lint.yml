name: Lint
'on':
  workflow_call:
    inputs:
      since:
        description: Base commit to lint changes against. Empty lints everything.
        type: string
        default: ''
permissions:
  contents: read
jobs:
  lint:
    name: Lint & format (biome check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Biome
        env:
          SINCE: ${{ inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            pnpm exec biome check --changed --since="$SINCE" --no-errors-on-unmatched
          else
            pnpm lint
          fi
      - run: pnpm lint:style:self-test
      - run: pnpm lint:style
    timeout-minutes: 15
