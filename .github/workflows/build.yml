name: Build

# Smoke tests run against the emitted package, not the TypeScript source.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: node-${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm build
      - name: Smoke-test the built CLI
        run: |
          node dist/cli/index.js --version
          node dist/cli/index.js --help
          node dist/cli/index.js explain csr
